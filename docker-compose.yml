services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: booklog
      POSTGRES_PASSWORD: booklog
      POSTGRES_DB: booklog_production
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://booklog:booklog@db:5432/booklog_production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}

volumes:
  postgres_data: